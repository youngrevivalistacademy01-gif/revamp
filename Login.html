<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign In — Young Revivalist Academy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant:ital,wght@0,500;0,600;1,500;1,600&family=Frank+Ruhl+Libre:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="Login.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
</head>
<body>

  <div class="intro-overlay" id="introOverlay">
    <div class="intro-flare" aria-hidden="true"></div>
    <p class="intro-verse">Thy word is a lamp unto my feet,<br>and a light unto my path.</p>
    <span class="intro-cite">Psalm 119:105</span>
  </div>

  <div class="void-stage" aria-hidden="true">
    <canvas id="dustCanvas"></canvas>
    <div class="god-rays"></div>
    <div class="lamp-glow" id="lampGlow"></div>
    <div class="vignette"></div>
    <div class="grain"></div>
  </div>

  <a href="index.html" class="home-link">&larr; Young Revivalist Academy</a>
  <a href="login.html?admin=1" class="admin-link" id="adminLink">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2l7 4v6c0 5-3.5 8.5-7 10-3.5-1.5-7-5-7-10V6l7-4z"/></svg>
    Admin Login
  </a>

  <main class="auth-wrap">
    <div class="auth-card" id="authCard">
      <p class="eyebrow" id="cardEyebrow">Psalm 119:105</p>
      <h1 id="cardHeading">Welcome Back.</h1>
      <p class="auth-sub" id="cardSub">Thy word is a lamp unto my feet. Sign in to continue your path.</p>

      <div class="auth-error" id="authError" role="alert" hidden></div>

      <form id="loginForm" novalidate>
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" autocomplete="email" required placeholder="you@example.com">
        </div>

        <div class="field">
          <div class="field-label-row">
            <label for="password">Password</label>
            <a href="reset-password.html" class="forgot-link">Forgot?</a>
          </div>
          <div class="password-shell">
            <input type="password" id="password" name="password" autocomplete="current-password" required placeholder="&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;">
            <button type="button" class="password-toggle" id="passwordToggle" aria-label="Show password">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>

        <button type="submit" class="btn-submit" id="submitBtn">
          <span class="btn-label">Sign In</span>
          <span class="btn-spinner" aria-hidden="true"></span>
        </button>
      </form>

      <div class="auth-divider"><span>New to the Academy?</span></div>

      <a href="signup.html" class="btn-outline-full">Create an Account &mdash; It's Free</a>
    </div>
  </main>

  <script src="Login.js"></script>
</body>
</html>
